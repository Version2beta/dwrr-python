name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B scripts/kit_check.py
      - run: python -B ci/test_integrity.py
      - run: python -B scripts/judge.py all
      - run: python -B vendor/shared/tools/replay.py --driver 'python -B scripts/conformance_driver.py'
      - run: python -B vendor/shared/tools/check_driver.py --driver 'python -B scripts/conformance_driver.py'
      - run: PYTHONPATH="$PWD:$PWD/examples/fair_transfer" python -B -m unittest discover -s examples/fair_transfer/tests -v
      - name: Prepare declared public build tools
        run: |
          python -m pip install build==1.6.1 setuptools==84.2.1 wheel==0.48.0 packaging==26.3 pyproject_hooks==1.3.3
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/build-wheels" setuptools==84.2.1 wheel==0.48.0 packaging==26.3
      - name: Offline archives, isolated installs and README histories
        env:
          DWRR_BUILD_WHEELS: ${{ runner.temp }}/build-wheels
        run: DWRR_BUILD_PYTHON="$(command -v python)" python -B scripts/package_check.py
      - run: git diff --exit-code && git diff --check
